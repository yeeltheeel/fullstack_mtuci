services:
  db:
    image: postgres:17
    container_name: bookexchange-db
    environment:
      POSTGRES_USER: bookexchange
      POSTGRES_PASSWORD: bookexchange
      POSTGRES_DB: bookexchange
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bookexchange -d bookexchange" ]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - bookexchange-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: bookexchange-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://bookexchange:bookexchange@db:5432/bookexchange
      SECRET_KEY: SomeKey!1
      ACCESS_TOKEN_EXPIRE_MIN: "60"
      DEBUG: "true"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      python -m debugpy 
        --listen 0.0.0.0:5678 
        -m uvicorn main:app --host 0.0.0.0 --port 8080 --reload --reload-dir /app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bookexchange-frontend
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: backend
    restart: on-failure

volumes:
  bookexchange-data:
